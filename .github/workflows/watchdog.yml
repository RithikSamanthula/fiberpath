name: Watchdog

# Every 3 hours: if no planning run is queued or in progress, start one.
on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow plan-counties.yml --json status -q '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          echo "active planning runs: $n"
          if [ "$n" = "0" ]; then gh workflow run plan-counties.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
