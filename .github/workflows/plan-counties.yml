name: Plan counties

# Plans every U.S. county, forever. Each cycle runs up to six parallel shards (split by state) for about 5.5 hours.
# Every county is published to a GitHub release the moment it finishes, so the website shows it live. Progress is recorded on the "progress" branch, then starts the next cycle.
# When every county is done it waits 30 days and starts over with fresh data. A cron entry restarts the loop
# if it ever stops. Needs the repository secret MAPILLARY_TOKEN.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: plan-counties
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      remaining: ${{ steps.r.outputs.remaining }}
      shards: ${{ steps.r.outputs.shards }}
      budget: ${{ steps.r.outputs.budget }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests numpy
      - id: r
        run: |
          python pipeline/national.py list
          .github/scripts/progress.sh pull "$RUNNER_TEMP/p"
          total=$(python -c "import json;print(len(json.load(open('pipeline/cache/counties.json'))))")
          done_n=$(wc -l < "$RUNNER_TEMP/p/done.txt" | tr -d ' ')
          remaining=$((total - done_n))
          age=$(( ( $(date -u +%s) - $(date -u -d "$(cat $RUNNER_TEMP/p/cycle.txt)" +%s) ) / 86400 ))
          if [ "$remaining" -le 0 ] && [ "$age" -ge 30 ]; then
            .github/scripts/progress.sh reset
            remaining=$total
          fi
          # a private repository only gets 2,000 free minutes a month, so it runs one short shard
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate -q .isPrivate)" = "true" ]; then
            echo 'shards=[0]' >> "$GITHUB_OUTPUT"; echo 'budget=40' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=[0,1,2,3,4,5]' >> "$GITHUB_OUTPUT"; echo 'budget=320' >> "$GITHUB_OUTPUT"
          fi
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "$remaining counties remaining"

  plan:
    needs: prepare
    if: needs.prepare.outputs.remaining != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Load progress
        run: .github/scripts/progress.sh pull "$RUNNER_TEMP/p"
      - name: Plan counties
        working-directory: pipeline
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          FIBERPATH_DATA: ${{ github.workspace }}/out
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          [ -n "$MAPILLARY_TOKEN" ] || echo "::warning::MAPILLARY_TOKEN is not set; poles will come from OpenStreetMap only"
          python national.py list
          python -u national.py run --workers 2 --shard ${{ matrix.shard }}/6 \
            --budget-min ${{ needs.prepare.outputs.budget }} \
            --done-file "$RUNNER_TEMP/p/done.txt" --completed-out "$GITHUB_WORKSPACE/completed.txt"
      - name: Record progress
        if: always()
        run: |
          [ -s completed.txt ] || exit 0
          .github/scripts/progress.sh push ${{ matrix.shard }} completed.txt

  next:
    needs: [prepare, plan]
    if: always() && needs.prepare.outputs.remaining != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Start the next cycle
        run: gh workflow run plan-counties.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
